queueflow.jwt.secret=queueflow-test-secret-key-must-be-at-least-32-characters-long
queueflow.jwt.expiration-ms=3600000
queueflow.security.enabled=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/queueflow}
spring.datasource.username=${DB_USERNAME:queueflow_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
